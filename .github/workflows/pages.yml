name: Check Alongside

# Railway builds and deploys from this repository (see DEPLOY-RAILWAY.md).
# This workflow only checks every change; it no longer publishes to GitHub Pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check source
        run: npm run check
      - name: Test
        run: npm test
      - name: Test private connection checker offline
        run: python3 -B -m unittest discover -s tests -p test_connection.py
      - name: Build public files only
        run: npm run build
      - name: Verify first-visit link matches this release
        run: node scripts/check-first-visit.mjs
